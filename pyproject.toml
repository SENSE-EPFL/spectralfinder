[project]
name = "projet-semestre"
version = "1.1.0"
description = "SpectralFinder: spectral-window selector for simultaneous multi-gas detection, using HITRAN data via HAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hitran-api>=1.3.0.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "plotly>=7.1.0",
    "dash>=4.4.1",
    "gunicorn>=26.2.0",
    "pandas>=3.0.6",
]
